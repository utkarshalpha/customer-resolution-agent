# One-click deploy: https://render.com/deploy?repo=https://github.com/utkarshalpha/customer-resolution-agent
# Free plan runs `node server.js` as a persistent process — required for the
# in-memory session store, supervisor notices, and the /admin console.
# No env vars needed (keyless free-LLM mode); add GROQ_API_KEY / GEMINI_API_KEY /
# ANTHROPIC_API_KEY in the Render dashboard later for a faster, more reliable provider.
services:
  - type: web
    name: customer-resolution-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
